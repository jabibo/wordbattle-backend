name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'wordbattle-backend/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'wordbattle-backend/**'
      - '.github/workflows/tests.yml'

defaults:
  run:
    working-directory: ./wordbattle-backend

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: wordbattle_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: wordbattle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: wordbattle-backend/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run tests with coverage
      env:
        TESTING: 1
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: wordbattle_test
        DB_PASSWORD: test_password_123
        DB_NAME: wordbattle_test
        CLOUD_PROVIDER: gcp
        GOOGLE_CLOUD_PROJECT: wordbattle-test
        USE_CLOUD_SQL: false
        SECRET_KEY: test-secret-key-for-ci-only
      run: |
        PYTHONPATH=. pytest tests/unit/game_logic/test_letter_bag.py \
                               tests/unit/game_logic/test_rack.py \
                               tests/unit/game_logic/test_validate_move_comprehensive.py \
                               tests/unit/game_logic/test_full_points_comprehensive.py \
                               tests/unit/game_logic/test_board_utils_comprehensive.py \
                               tests/unit/routers/test_config_api.py \
                               --cov=app \
                               --cov-report=xml \
                               --cov-report=term \
                               --cov-report=html \
                               -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        file: ./wordbattle-backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: Archive coverage HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: wordbattle-backend/htmlcov/
        retention-days: 30

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=20

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run linting checks
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        
        # Exit-zero treats all errors as warnings
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
        # Check code formatting (don't fail, just report)
        black --check app || true
        isort --check-only app || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run security checks
      run: |
        # Check for common security issues
        bandit -r app -ll || true
        
        # Check for known security vulnerabilities in dependencies
        safety check --file=requirements.txt --output=text || true

