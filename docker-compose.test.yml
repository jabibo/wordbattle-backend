version: '3.8'

services:
  postgres-test:
    image: postgres:14-alpine
    container_name: wordbattle-test-db
    environment:
      POSTGRES_USER: wordbattle_test
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_DB: wordbattle_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordbattle_test -d wordbattle_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    container_name: wordbattle-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

volumes:
  postgres_test_data:

networks:
  test-network:
    driver: bridge

